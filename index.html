<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sevenfour</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --fg: #f0ede8;
      --accent: #c8b89a;
      --muted: #6b6560;
      --panel-bg: rgba(10, 10, 10, 0.97);
      --border: rgba(255,255,255,0.07);
      --serif: 'Georgia', 'Times New Roman', serif;
      --mono: 'Courier New', monospace;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      overflow: hidden;
    }

    /* ── HERO ── */
    #hero {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    #hero-video {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.4s ease;
    }
    #hero-video.loaded { opacity: 1; }

    #hero-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 30% 60%, #1a1208 0%, #0a0a0a 70%);
    }

    #hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.6) 100%);
      pointer-events: none;
    }

    /* ── NAV BAR ── */
    #nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 0 28px;
      height: 52px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    /* shared nav type style */
    .nav-type {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      line-height: 1;
      color: var(--fg);
    }

    /* left section */
    #nav-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    #nav-bracket {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--muted);
      line-height: 1;
    }

    #acq-btn {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--fg);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      position: relative;
      transition: color 0.2s;
    }
    #acq-btn::after {
      content: '';
      position: absolute;
      bottom: -3px; left: 0;
      height: 1px;
      background: var(--fg);
      width: 0;
      transition: width 0.3s ease;
    }
    #acq-btn:hover::after,
    #acq-btn.active::after { width: 100%; }
    #acq-btn.active { color: var(--accent); }
    #acq-btn.active::after { background: var(--accent); }

    /* center wordmark */
    #wordmark {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--fg);
      text-decoration: none;
      line-height: 1;
      justify-self: center;
    }

    /* right section */
    #nav-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    /* ── MUTE BUTTON (in nav) ── */
    #mute-btn {
      background: none;
      border: none;
      color: var(--fg);
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
      line-height: 0;
    }
    #mute-btn:hover { color: var(--accent); }
    #mute-btn svg { width: 16px; height: 16px; display: block; }

    /* ── ACQUISITION PANEL ── */
    #panel {
      position: fixed;
      top: 0; left: 0;
      width: min(560px, 100vw);
      height: 100vh;
      z-index: 90;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      transform: translateX(-100%);
      transition: transform 0.55s cubic-bezier(0.77, 0, 0.18, 1);
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }
    #panel.open { transform: translateX(0); }

    #panel::-webkit-scrollbar { width: 3px; }
    #panel::-webkit-scrollbar-track { background: transparent; }
    #panel::-webkit-scrollbar-thumb { background: var(--border); }

    #panel-header {
      padding: 28px 36px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--panel-bg);
      z-index: 2;
    }
    #panel-title {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--accent);
    }
    #panel-close {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      padding: 0;
      transition: color 0.2s;
    }
    #panel-close:hover { color: var(--fg); }

    #panel-list {
      padding: 0 36px 60px;
      display: flex;
      flex-direction: column;
    }

    /* ── ARTWORK ITEM ── */
    .artwork {
      padding: 36px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .artwork:last-child { border-bottom: none; }

    .artwork-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
      margin-bottom: 20px;
      opacity: 0.85;
      transition: opacity 0.3s;
      background: #111;
    }
    .artwork:hover .artwork-thumb { opacity: 1; }

    .artwork-thumb-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      margin-bottom: 20px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
      transition: background 0.3s;
    }
    .artwork:hover .artwork-thumb-placeholder { background: #161616; }

    .artwork-title {
      font-family: var(--serif);
      font-size: 17px;
      font-weight: normal;
      letter-spacing: 0.04em;
      color: var(--fg);
      margin-bottom: 14px;
      line-height: 1.3;
    }

    .artwork-meta {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 6px 0;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.14em;
    }
    .meta-key { text-transform: uppercase; color: var(--muted); }
    .meta-val { color: var(--accent); text-transform: uppercase; }

    .artwork-desc {
      margin-top: 16px;
      font-size: 11px;
      line-height: 1.75;
      color: var(--muted);
      letter-spacing: 0.03em;
      display: none;
    }
    .artwork.expanded .artwork-desc { display: block; }

    /* ── OVERLAY ── */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }
    #overlay.visible { opacity: 1; pointer-events: all; }

    /* ── CREDITS ── */
    #credits {
      position: fixed;
      bottom: 28px;
      right: 36px;
      z-index: 10;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
      text-align: right;
      line-height: 1.8;
      opacity: 0.6;
    }

    /* ── LIGHTBOX ── */
    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s;
    }
    #lightbox.visible { opacity: 1; pointer-events: all; }
    #lightbox img { max-width: 90vw; max-height: 85vh; object-fit: contain; }
    #lightbox-close {
      position: absolute;
      top: 28px; right: 36px;
      background: none; border: none;
      color: var(--muted); font-size: 22px;
      cursor: pointer; transition: color 0.2s;
    }
    #lightbox-close:hover { color: var(--fg); }
  </style>
</head>
<body>

<!-- HERO -->
<div id="hero">
  <div id="hero-bg"></div>
  <video id="hero-video" autoplay muted loop playsinline>
    <source src="video/hero.mp4" type="video/mp4" />
  </video>
</div>

<!-- NAV -->
<nav id="nav">
  <div id="nav-left">
    <span id="nav-bracket">[ ]</span>
    <button id="acq-btn" aria-expanded="false">Acquisition</button>
  </div>

  <a id="wordmark" href="#">Sevenfour</a>

  <div id="nav-right">
    <button id="mute-btn" aria-label="Toggle sound">
      <svg id="icon-muted" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <line x1="23" y1="9" x2="17" y2="15"/>
        <line x1="17" y1="9" x2="23" y2="15"/>
      </svg>
      <svg id="icon-sound" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
    </button>
  </div>
</nav>

<!-- OVERLAY -->
<div id="overlay"></div>

<!-- ACQUISITION PANEL -->
<div id="panel" role="dialog" aria-label="Acquisition — Selected Works">
  <div id="panel-header">
    <span id="panel-title">Acquisition — Selected Works</span>
    <button id="panel-close" aria-label="Close panel">&#x2715;</button>
  </div>
  <div id="panel-list"></div>
</div>

<!-- CREDITS -->
<div id="credits">
  Motion &amp; Visual Development<br/>
  Available for Acquisition
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <button id="lightbox-close" aria-label="Close">&#x2715;</button>
  <img id="lightbox-img" src="" alt="" />
</div>

<script>
  // ── WORKS DATA ────────────────────────────────────────────────────────────
  const WORKS = [
    {
      title: "Untitled 001",
      year: "2024",
      medium: "Digital / 3D Render",
      role: "Art Direction, 3D",
      tools: "Blender, Octane, After Effects",
      desc: "A study in form and negative space. Procedurally generated geometry rendered under a single point source.",
      image: "",
    },
    {
      title: "Passage",
      year: "2023",
      medium: "Mixed Media",
      role: "Concept, Compositing",
      tools: "Houdini, Nuke, Photoshop",
      desc: "Exploration of liminal architecture — spaces that exist between states.",
      image: "",
    },
    {
      title: "Static Ritual",
      year: "2023",
      medium: "Video Installation",
      role: "Direction, VFX",
      tools: "Unreal Engine, DaVinci Resolve",
      desc: "Single-channel video loop. Distorted imagery processed through feedback loops and custom GLSL shaders.",
      image: "",
    },
    {
      title: "Mineral Study IV",
      year: "2022",
      medium: "Photography / Retouching",
      role: "Photography, Post-production",
      tools: "Capture One, Photoshop, Lightroom",
      desc: "Macro documentation of geological specimens. Colour graded to emphasise crystalline structure.",
      image: "",
    },
    {
      title: "Infrastructure",
      year: "2022",
      medium: "Motion Graphics",
      role: "Design, Animation",
      tools: "Cinema 4D, Redshift, After Effects",
      desc: "Abstract systems map rendered as kinetic sculpture.",
      image: "",
    },
  ];
  // ─────────────────────────────────────────────────────────────────────────

  const panel    = document.getElementById('panel');
  const acqBtn   = document.getElementById('acq-btn');
  const closeBtn = document.getElementById('panel-close');
  const overlay  = document.getElementById('overlay');
  const list     = document.getElementById('panel-list');
  const video    = document.getElementById('hero-video');
  const lightbox = document.getElementById('lightbox');
  const lbImg    = document.getElementById('lightbox-img');
  const lbClose  = document.getElementById('lightbox-close');

  // Build artwork list
  WORKS.forEach((w) => {
    const el = document.createElement('div');
    el.className = 'artwork';

    const thumb = w.image
      ? `<img class="artwork-thumb" src="${w.image}" alt="${w.title}" loading="lazy" />`
      : `<div class="artwork-thumb-placeholder">[ ${w.medium} ]</div>`;

    el.innerHTML = `
      ${thumb}
      <div class="artwork-title">${w.title}</div>
      <div class="artwork-meta">
        <span class="meta-key">Year</span>  <span class="meta-val">${w.year}</span>
        <span class="meta-key">Medium</span><span class="meta-val">${w.medium}</span>
        <span class="meta-key">Role</span>  <span class="meta-val">${w.role}</span>
        <span class="meta-key">Tools</span> <span class="meta-val">${w.tools}</span>
      </div>
      ${w.desc ? `<p class="artwork-desc">${w.desc}</p>` : ''}
    `;

    el.addEventListener('click', (e) => {
      if (e.target.tagName === 'IMG') { openLightbox(w.image, w.title); return; }
      el.classList.toggle('expanded');
    });

    list.appendChild(el);
  });

  // Panel
  function openPanel()  { panel.classList.add('open'); overlay.classList.add('visible'); acqBtn.classList.add('active'); acqBtn.setAttribute('aria-expanded','true'); }
  function closePanel() { panel.classList.remove('open'); overlay.classList.remove('visible'); acqBtn.classList.remove('active'); acqBtn.setAttribute('aria-expanded','false'); }

  acqBtn.addEventListener('click', () => panel.classList.contains('open') ? closePanel() : openPanel());
  closeBtn.addEventListener('click', closePanel);
  overlay.addEventListener('click', closePanel);

  // Video fade-in
  video.addEventListener('canplay', () => video.classList.add('loaded'));

  // Mute toggle
  const iconMuted = document.getElementById('icon-muted');
  const iconSound = document.getElementById('icon-sound');

  function updateMuteUI() {
    iconMuted.style.display = video.muted ? 'block' : 'none';
    iconSound.style.display = video.muted ? 'none'  : 'block';
  }

  document.getElementById('mute-btn').addEventListener('click', () => {
    video.muted = !video.muted;
    updateMuteUI();
  });

  // Lightbox
  function openLightbox(src, alt)  { lbImg.src = src; lbImg.alt = alt; lightbox.classList.add('visible'); }
  function closeLightbox()         { lightbox.classList.remove('visible'); }
  lbClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closePanel(); closeLightbox(); }
  });
</script>
</body>
</html>
