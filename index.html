<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sevenfour</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --fg: #d4cfc9;
      --fg-dim: #8a8480;
      --accent: #b8a882;
      --term-bg: rgba(12, 14, 12, 0.96);
      --term-border: rgba(180,200,160,0.18);
      --term-green: #7aab6e;
      --term-green-dim: rgba(122,171,110,0.45);
      --term-hi: #c8dfc0;
      --mono: 'Courier New', monospace;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--mono);
      overflow: hidden;
    }

    /* ── HERO ── */
    #hero { position: fixed; inset: 0; z-index: 0; }

    #hero-video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.4s ease;
    }
    #hero-video.loaded { opacity: 1; }

    #hero-bg {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 30% 60%, #101410 0%, #0a0a0a 70%);
    }

    #hero::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.55) 100%);
      pointer-events: none;
    }

    /* ── NAV BAR ── */
    #nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 0 28px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #nav-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    #nav-bracket {
      font-size: 12px;
      color: var(--fg-dim);
      letter-spacing: 0.05em;
    }

    #acq-btn {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--fg);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      position: relative;
      transition: color 0.2s;
    }
    #acq-btn::after {
      content: '';
      position: absolute;
      bottom: -3px; left: 0;
      height: 1px;
      background: currentColor;
      width: 0;
      transition: width 0.3s ease;
    }
    #acq-btn:hover { color: var(--term-hi); }
    #acq-btn:hover::after,
    #acq-btn.active::after { width: 100%; }
    #acq-btn.active { color: var(--term-green); }

    /* mute */
    #mute-btn {
      background: none; border: none;
      color: var(--fg-dim);
      padding: 0; cursor: pointer;
      display: flex; align-items: center;
      transition: color 0.2s; line-height: 0;
    }
    #mute-btn:hover { color: var(--fg); }
    #mute-btn svg { width: 16px; height: 16px; display: block; }

    /* ── OVERLAY ── */
    #overlay {
      position: fixed; inset: 0; z-index: 80;
      background: rgba(0,0,0,0.35);
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s;
    }
    #overlay.visible { opacity: 1; pointer-events: all; }

    /* ── TERMINAL PANEL ── */
    #panel {
      position: fixed;
      top: 48px; left: 0;
      width: min(900px, 100vw);
      max-height: calc(100vh - 48px);
      z-index: 90;
      background: var(--term-bg);
      border: 1px solid var(--term-border);
      border-top: none;
      display: flex;
      flex-direction: column;
      transform: translateY(-8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      overflow: hidden;
    }
    #panel.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }

    /* scanline texture */
    #panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 0;
    }

    /* titlebar */
    #panel-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 36px;
      border-bottom: 1px solid var(--term-border);
      background: rgba(0,0,0,0.3);
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    #panel-titlebar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--term-green);
    }
    #panel-titlebar-left .hash { color: var(--term-green-dim); }

    #panel-close {
      background: none; border: none;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--fg-dim);
      padding: 0;
      transition: color 0.2s;
    }
    #panel-close:hover { color: var(--term-hi); }

    /* meta row */
    #panel-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border-bottom: 1px solid var(--term-border);
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    .panel-meta-cell {
      padding: 12px 20px;
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--fg-dim);
      line-height: 1.6;
    }
    .panel-meta-cell:first-child { border-right: 1px solid var(--term-border); }

    /* body: two-column layout */
    #panel-body {
      display: grid;
      grid-template-columns: 300px 1fr;
      flex: 1;
      min-height: 0;
      position: relative;
      z-index: 1;
    }

    /* left: work list */
    #panel-list {
      border-right: 1px solid var(--term-border);
      overflow-y: auto;
      overflow-x: hidden;
    }
    #panel-list::-webkit-scrollbar { width: 2px; }
    #panel-list::-webkit-scrollbar-thumb { background: var(--term-border); }

    #panel-list-header {
      padding: 10px 20px;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--term-green-dim);
      border-bottom: 1px solid var(--term-border);
    }

    .work-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 20px;
      border-bottom: 1px solid rgba(180,200,160,0.07);
      cursor: pointer;
      transition: background 0.15s;
    }
    .work-row:hover { background: rgba(122,171,110,0.06); }
    .work-row.active { background: rgba(122,171,110,0.12); }

    .work-row-title {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--fg);
      transition: color 0.15s;
    }
    .work-row:hover .work-row-title,
    .work-row.active .work-row-title { color: var(--term-hi); }

    .work-row-year {
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--fg-dim);
    }

    /* right: detail */
    #panel-detail {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    #panel-detail::-webkit-scrollbar { width: 2px; }
    #panel-detail::-webkit-scrollbar-thumb { background: var(--term-border); }

    #detail-thumb-wrap {
      width: 100%;
      aspect-ratio: 16/9;
      background: #0c0f0c;
      border-bottom: 1px solid var(--term-border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    #detail-thumb-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .detail-no-thumb {
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--term-green-dim);
    }

    #detail-content {
      padding: 20px 24px 32px;
      flex: 1;
    }
    #detail-title {
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--term-hi);
      margin-bottom: 20px;
      line-height: 1.3;
    }
    .detail-meta-grid {
      display: grid;
      grid-template-columns: 70px 1fr;
      gap: 8px 0;
      margin-bottom: 20px;
    }
    .d-key {
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--fg-dim);
    }
    .d-val {
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--term-green);
    }
    #detail-desc {
      font-size: 10px;
      line-height: 1.8;
      color: var(--fg-dim);
      letter-spacing: 0.05em;
      border-top: 1px solid var(--term-border);
      padding-top: 16px;
      margin-top: 4px;
    }

    /* status bar */
    #panel-statusbar {
      border-top: 1px solid var(--term-border);
      padding: 0 20px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: rgba(0,0,0,0.3);
      position: relative;
      z-index: 1;
    }
    .status-text {
      font-size: 8px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--fg-dim);
    }
    .status-version {
      font-size: 8px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--term-green-dim);
    }

    /* ── LIGHTBOX ── */
    #lightbox {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.92);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    #lightbox.visible { opacity: 1; pointer-events: all; }
    #lightbox img { max-width: 90vw; max-height: 85vh; object-fit: contain; }
    #lightbox-close {
      position: absolute; top: 24px; right: 32px;
      background: none; border: none;
      color: var(--fg-dim); font-size: 20px;
      cursor: pointer; font-family: var(--mono);
      transition: color 0.2s;
    }
    #lightbox-close:hover { color: var(--fg); }
  </style>
</head>
<body>

<!-- HERO -->
<div id="hero">
  <div id="hero-bg"></div>
  <video id="hero-video" autoplay muted loop playsinline>
    <source src="video/hero.mp4" type="video/mp4" />
  </video>
</div>

<!-- NAV -->
<nav id="nav">
  <div id="nav-left">
    <span id="nav-bracket">[ ]</span>
    <button id="acq-btn" aria-expanded="false">Acquisition</button>
  </div>
  <div id="nav-right">
    <button id="mute-btn" aria-label="Toggle sound">
      <svg id="icon-muted" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <line x1="23" y1="9" x2="17" y2="15"/>
        <line x1="17" y1="9" x2="23" y2="15"/>
      </svg>
      <svg id="icon-sound" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
    </button>
  </div>
</nav>

<!-- OVERLAY -->
<div id="overlay"></div>

<!-- TERMINAL PANEL -->
<div id="panel" role="dialog" aria-label="Acquisition Terminal">

  <div id="panel-titlebar">
    <div id="panel-titlebar-left">
      <span class="hash">#</span>
      <span>Acquisition Terminal</span>
    </div>
    <button id="panel-close" aria-label="Close">&#x2715;</button>
  </div>

  <div id="panel-meta">
    <div class="panel-meta-cell">
      Works available for acquisition<br/>
      Click entry to view details
    </div>
    <div class="panel-meta-cell">
      Selected works — ongoing<br/>
      Motion &amp; Visual Development
    </div>
  </div>

  <div id="panel-body">
    <div id="panel-list">
      <div id="panel-list-header">Works — <span id="work-count">0</span></div>
    </div>
    <div id="panel-detail">
      <div id="detail-thumb-wrap">
        <span class="detail-no-thumb">[ Select a work ]</span>
      </div>
      <div id="detail-content">
        <div id="detail-title">—</div>
        <div class="detail-meta-grid" id="detail-meta"></div>
        <div id="detail-desc"></div>
      </div>
    </div>
  </div>

  <div id="panel-statusbar">
    <span class="status-text">Terminal v1.0 — Ready</span>
    <span class="status-version">Zhihong Studio</span>
  </div>

</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <button id="lightbox-close">&#x2715;</button>
  <img id="lightbox-img" src="" alt="" />
</div>

<script>
  // ── WORKS DATA ────────────────────────────────────────────────────────────
  const WORKS = [
    {
      title: "Untitled 001",
      year: "2024",
      medium: "Digital / 3D Render",
      role: "Art Direction, 3D",
      tools: "Blender, Octane, After Effects",
      desc: "A study in form and negative space. Procedurally generated geometry rendered under a single point source.",
      image: "",
    },
    {
      title: "Passage",
      year: "2023",
      medium: "Mixed Media",
      role: "Concept, Compositing",
      tools: "Houdini, Nuke, Photoshop",
      desc: "Exploration of liminal architecture — spaces that exist between states.",
      image: "",
    },
    {
      title: "Static Ritual",
      year: "2023",
      medium: "Video Installation",
      role: "Direction, VFX",
      tools: "Unreal Engine, DaVinci Resolve",
      desc: "Single-channel video loop. Distorted imagery processed through feedback loops and custom GLSL shaders.",
      image: "",
    },
    {
      title: "Mineral Study IV",
      year: "2022",
      medium: "Photography / Retouching",
      role: "Photography, Post-production",
      tools: "Capture One, Photoshop, Lightroom",
      desc: "Macro documentation of geological specimens. Colour graded to emphasise crystalline structure.",
      image: "",
    },
    {
      title: "Infrastructure",
      year: "2022",
      medium: "Motion Graphics",
      role: "Design, Animation",
      tools: "Cinema 4D, Redshift, After Effects",
      desc: "Abstract systems map rendered as kinetic sculpture.",
      image: "",
    },
  ];
  // ─────────────────────────────────────────────────────────────────────────

  const panel     = document.getElementById('panel');
  const acqBtn    = document.getElementById('acq-btn');
  const closeBtn  = document.getElementById('panel-close');
  const overlay   = document.getElementById('overlay');
  const listEl    = document.getElementById('panel-list');
  const video     = document.getElementById('hero-video');
  const lightbox  = document.getElementById('lightbox');
  const lbImg     = document.getElementById('lightbox-img');
  const lbClose   = document.getElementById('lightbox-close');

  document.getElementById('work-count').textContent = WORKS.length;

  // ── Build work list rows ─────────────────────────────────────────────────
  let activeRow = null;

  WORKS.forEach((w, i) => {
    const row = document.createElement('div');
    row.className = 'work-row';
    row.innerHTML = `
      <span class="work-row-title">${w.title}</span>
      <span class="work-row-year">${w.year}</span>
    `;
    row.addEventListener('click', () => {
      if (activeRow) activeRow.classList.remove('active');
      row.classList.add('active');
      activeRow = row;
      showDetail(w);
    });
    listEl.appendChild(row);

    // auto-select first
    if (i === 0) { row.click(); }
  });

  function showDetail(w) {
    const thumbWrap = document.getElementById('detail-thumb-wrap');
    if (w.image) {
      thumbWrap.innerHTML = `<img src="${w.image}" alt="${w.title}" />`;
      thumbWrap.querySelector('img').addEventListener('click', () => openLightbox(w.image, w.title));
    } else {
      thumbWrap.innerHTML = `<span class="detail-no-thumb">[ ${w.medium} ]</span>`;
    }
    document.getElementById('detail-title').textContent = w.title;
    document.getElementById('detail-meta').innerHTML = `
      <span class="d-key">Year</span>  <span class="d-val">${w.year}</span>
      <span class="d-key">Medium</span><span class="d-val">${w.medium}</span>
      <span class="d-key">Role</span>  <span class="d-val">${w.role}</span>
      <span class="d-key">Tools</span> <span class="d-val">${w.tools}</span>
    `;
    document.getElementById('detail-desc').textContent = w.desc || '';
  }

  // ── Panel open/close ─────────────────────────────────────────────────────
  function openPanel() {
    panel.classList.add('open');
    overlay.classList.add('visible');
    acqBtn.classList.add('active');
    acqBtn.setAttribute('aria-expanded', 'true');
  }
  function closePanel() {
    panel.classList.remove('open');
    overlay.classList.remove('visible');
    acqBtn.classList.remove('active');
    acqBtn.setAttribute('aria-expanded', 'false');
  }

  acqBtn.addEventListener('click', () => panel.classList.contains('open') ? closePanel() : openPanel());
  closeBtn.addEventListener('click', closePanel);
  overlay.addEventListener('click', closePanel);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closePanel(); closeLightbox(); } });

  // ── Video ────────────────────────────────────────────────────────────────
  video.addEventListener('canplay', () => video.classList.add('loaded'));

  // ── Mute ─────────────────────────────────────────────────────────────────
  const iconMuted = document.getElementById('icon-muted');
  const iconSound = document.getElementById('icon-sound');

  function updateMuteUI() {
    iconMuted.style.display = video.muted ? 'block' : 'none';
    iconSound.style.display = video.muted ? 'none'  : 'block';
  }
  document.getElementById('mute-btn').addEventListener('click', () => {
    video.muted = !video.muted;
    updateMuteUI();
  });

  // ── Lightbox ──────────────────────────────────────────────────────────────
  function openLightbox(src, alt) { lbImg.src = src; lbImg.alt = alt; lightbox.classList.add('visible'); }
  function closeLightbox()        { lightbox.classList.remove('visible'); }
  lbClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
</script>
</body>
</html>
